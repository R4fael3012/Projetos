<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preços - Carro e Bicicleta</title>
    <link rel="stylesheet" href="/Aula 06/css/style.css">
</head>
<body>
    <header>
        <h1>Carros, Bicicletas e Aviões</h1>
    </header>

    <main>
        <section class="produtos">
            <article class="produto">
                <div class="info-produto">
                    <h2>Carro: <span>R$ 1999</span></h2>
                    <p>Carro modelo <span>2045</span>, com <span>200km</span> rodados</p>
                    <button type="button">Comprar Carro</button>
                </div>
                <div class="imagem-produto">
                    <img src="/Aula 06/img/images.jpg" alt="Carro">
                </div>                                                      
            </article>

            <article class="produto">
                <div class="info-produto">
                    <h2>Bicicleta: <span>R$ 199</span></h2>
                    <p>Bicicleta modelo <span>2050</span>, com <span>20km</span> rodados</p>
                    <button type="button">Comprar Bicicleta</button>
                </div>
                <div class="imagem-produto">
                    <img src="/Aula 06/img/images (1).jpg" alt="Bicicleta">
                </div>                                   
            </article>

            <article class="produto">
                <div class="info-produto"> 
                    <h2>Avião: <span>R$ 19999</span></h2>                    
                    <p>Avião modelo <span>2120</span>, com <span>20000km</span> rodados</p>
                    <button type="button">Comprar Avião</button>
                </div>  
                <div class="imagem-produto">
                    <img src="/Aula 06/img/istockphoto-1355587180-612x612.jpg" alt="Avião">
                </div>                                                                                                 
            </article>
        </section>
    </main>
</body>
</html>
